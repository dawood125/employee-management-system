# =====================================================
# MERN Stack CI/CD Pipeline
# Project: Employee Management System
# Target: Azure VM (ems-vm @ 102.37.107.205)
# =====================================================

trigger:
  branches:
    include:
      - main

variables:
  - name: 'vmHost'
    value: '102.37.107.205'
  - name: 'vmUser'
    value: 'azureuser'
  - name: 'appPath'
    value: '/home/azureuser/employee-management-system'

stages:
  - stage: BuildFrontend
    displayName: 'Build React Frontend'
    jobs:
      - job: BuildReact
        displayName: 'Build React app with Vite'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js 20'

          - script: |
              cd frontend
              npm ci
            displayName: 'Install frontend dependencies'

          - script: |
              cd frontend
              npm run build
            displayName: 'Build frontend for production'

          - task: CopyFiles@2
            inputs:
              SourceFolder: 'frontend/dist'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/frontend-dist'
            displayName: 'Copy built files to staging'

          - publish: '$(Build.ArtifactStagingDirectory)'
            artifact: frontend-dist
            displayName: 'Publish frontend artifact'

  - stage: DeployToVM
    displayName: 'Deploy to Azure VM'
    dependsOn: BuildFrontend
    condition: succeeded()
    jobs:
      - job: DeployApp
        displayName: 'Deploy MERN app to VM via SSH'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadSecureFile@1
            name: sshKey
            inputs:
              secureFile: 'ems-vm-ssh-key'
            displayName: 'Download SSH key from secure files'

          - script: |
              chmod 600 $(sshKey.secureFilePath)
              echo "=== Starting deployment ==="

              ssh -i $(sshKey.secureFilePath) -o StrictHostKeyChecking=no $(vmUser)@$(vmHost) << 'ENDSSH'
              set -e
              echo "=== Connected to VM ==="
              cd $(appPath)
              git pull origin main
              cd $(appPath)/backend
              npm ci --production
              cd $(appPath)/frontend
              npm ci
              npm run build
              chmod -R o+rX $(appPath)/frontend/dist
              chmod o+x $(appPath) $(appPath)/frontend $(appPath)/frontend/dist
              pm2 restart ems-backend || pm2 start server.js --name ems-backend
              pm2 save
              sudo nginx -t
              sudo systemctl reload nginx
              echo "=== Deployment complete ==="
              ENDSSH
            displayName: 'Deploy to VM via SSH'
