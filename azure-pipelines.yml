# =====================================================
# MERN Stack CI/CD Pipeline
# Project: Employee Management System
# Target: Azure VM (ems-vm @ 102.37.107.205)
# =====================================================

trigger:
  branches:
    include:
      - main

variables:
  vmServiceConnection: 'azure-vm-ssh'
  vmUser: 'azureuser'
  appPath: '/home/azureuser/employee-management-system'

stages:
  - stage: BuildFrontend
    displayName: 'Build React Frontend'
    jobs:
      - job: BuildReact
        displayName: 'Build React app with Vite'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js 20'

          - script: |
              cd frontend
              npm ci
            displayName: 'Install frontend dependencies'

          - script: |
              cd frontend
              npm run build
            displayName: 'Build frontend for production'

          - task: CopyFiles@2
            inputs:
              SourceFolder: 'frontend/dist'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/frontend-dist'
            displayName: 'Copy built files to staging'

          - publish: '$(Build.ArtifactStagingDirectory)'
            artifact: frontend-dist
            displayName: 'Publish frontend artifact'

  - stage: DeployToVM
    displayName: 'Deploy to Azure VM'
    dependsOn: BuildFrontend
    condition: succeeded()
    jobs:
      - deployment: DeployApp
        displayName: 'Deploy MERN app via SSH'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend-dist
                  displayName: 'Download frontend artifact'

                - task: CopyFilesOverSSH@0
                  inputs:
                    sshEndpoint: '$(vmServiceConnection)'
                    sourceFolder: '$(Pipeline.Workspace)/frontend-dist'
                    contents: '**'
                    targetFolder: '/tmp/frontend-dist'
                    cleanTargetFolder: true
                  displayName: 'Copy frontend to VM (via SSH)'

                - task: SSH@0
                  inputs:
                    sshEndpoint: '$(vmServiceConnection)'
                    runOptions: 'commands'
                    commands: |
                      set -e
                      echo "=== Starting deployment ==="
                      cd $(appPath)
                      git pull origin main
                      cd $(appPath)/backend
                      npm ci --production
                      sudo rm -rf $(appPath)/frontend/dist/*
                      cp -r /tmp/frontend-dist/* $(appPath)/frontend/dist/
                      chmod -R o+rX $(appPath)/frontend/dist
                      chmod o+x $(appPath) $(appPath)/frontend $(appPath)/frontend/dist
                      pm2 restart ems-backend || pm2 start server.js --name ems-backend
                      pm2 save
                      sudo nginx -t
                      sudo systemctl reload nginx
                      echo "=== Deployment complete ==="
                    readyTimeout: '60000'
                  displayName: 'Execute deployment on VM'
